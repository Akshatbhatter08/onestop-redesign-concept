<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Browser chrome colour = the shared cream page background (light) and dark
         toast (dark). Part of the design system, identical across businesses. -->
    <meta name="theme-color" content="#FDF7EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2B1810" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO:START — title, description, social tags, and JSON-LD are injected from
         src/config/business.ts at build (and dev) time by the inject-seo plugin in
         vite.config.ts. Do NOT hand-edit; change the config instead. The values
         below are a readable fallback that mirror what the plugin generates. -->
    <title>One Stop Waffle Shop — Authentic Belgian &amp; Liège waffles in Toronto's Junction</title>
    <meta
      name="description"
      content="Fresh Belgian waffles, authentic Liège waffles, handcrafted milkshakes, and catering in Toronto's Junction. Order online for pickup or delivery."
    />
    <meta name="apple-mobile-web-app-title" content="One Stop Waffle" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="One Stop Waffle Shop — Authentic Belgian &amp; Liège waffles in Toronto's Junction" />
    <meta
      property="og:description"
      content="Fresh Belgian waffles, authentic Liège waffles, handcrafted milkshakes, and catering in Toronto's Junction. Order online for pickup or delivery."
    />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "One Stop Waffle Shop",
        "servesCuisine": ["Belgian Waffles", "Liège Waffles", "Desserts", "Milkshakes", "Coffee"],
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Toronto",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "sameAs": ["https://instagram.com/onestopwaffleshop"]
      }
    </script>
    <!-- SEO:END -->

    <!-- Warm the glTF while the JS bundle parses — otherwise Vercel visitors wait
         for the idle gate, then the 1MB three.js chunk, *then* this 1MB bin. -->
    <link rel="preload" href="/models/scene.gltf" as="fetch" crossorigin />
    <link rel="preload" href="/models/scene.bin" as="fetch" crossorigin />

    <!-- Fonts: Fraunces (display) + Plus Jakarta Sans (body). See README to self-host. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />

    <!-- Paint the brand cream immediately so there is never a white flash. -->
    <style>
      html {
        background-color: #fdf7ee;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
