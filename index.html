<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>One Stop Waffle Shop — Authentic Belgian & Liège Waffles | Toronto's Junction</title>
    <meta
      name="description"
      content="Fresh Belgian waffles, authentic Liège waffles, handcrafted milkshakes, and catering in Toronto's Junction. Order online for pickup or delivery."
    />
    <meta name="theme-color" content="#FDF7EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2B1810" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-title" content="One Stop Waffle" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="One Stop Waffle Shop — Belgian & Liège waffles in Toronto" />
    <meta
      property="og:description"
      content="Authentic Belgian & Liège waffles, handcrafted milkshakes, and catering in Toronto's Junction. Order online."
    />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Fraunces (display) + Plus Jakarta Sans (body). See README to self-host. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />

    <!-- Paint the brand cream immediately so there is never a white flash. -->
    <style>
      html {
        background-color: #fdf7ee;
      }
    </style>

    <!-- TBD: add streetAddress, telephone, geo and openingHoursSpecification once the
         real listing details are confirmed. Locality/region are from their live site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "One Stop Waffle Shop",
        "url": "https://onestopwaffle.shop",
        "servesCuisine": ["Belgian Waffles", "Liège Waffles", "Desserts", "Milkshakes", "Coffee"],
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Toronto",
          "addressRegion": "ON",
          "addressCountry": "CA"
        },
        "sameAs": ["https://www.instagram.com/onestopwaffleshop"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
